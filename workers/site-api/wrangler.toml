name = "arn-site-api"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = false

routes = [
  { pattern = "ahmetrifatalbuz.com/api/*", zone_name = "ahmetrifatalbuz.com" },
  { pattern = "www.ahmetrifatalbuz.com/api/*", zone_name = "ahmetrifatalbuz.com" },
  { pattern = "ahmetrifatalbuz.com/", zone_name = "ahmetrifatalbuz.com" },
  { pattern = "ahmetrifatalbuz.com/en/", zone_name = "ahmetrifatalbuz.com" }
]

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "INBOX"
id = "964f14c99f6347e1b1b9bfeb31566df1"

[[send_email]]
name = "EMAIL"
destination_address = "ahmetrifatalbuz@gmail.com"
